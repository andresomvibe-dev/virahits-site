<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua Faixa — MC Exemplo | ViraHits</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #08070d;
    --card: #15121f;
    --border: rgba(255,255,255,0.1);
    --text: #f4f2f8;
    --text-muted: #9c97ac;
    --pink: #ff2d5f;
    --orange: #c81151;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }

  .sl-page{
    width:100%; max-width:400px;
    background:var(--card);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
    border:1px solid var(--border);
  }

  .sl-cover-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:linear-gradient(135deg, #7c3aed, var(--pink), var(--orange));
    background-size:200% 200%;
    animation:slGrad 8s ease infinite;
  }
  @keyframes slGrad{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .sl-cover-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .sl-cover-wrap::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(8,7,13,0.85) 100%);
  }
  .sl-brand{
    position:absolute; top:16px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:2px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:16px; color:#fff;
    z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .sl-brand .v{
    width:18px; height:18px; border-radius:5px;
    background:linear-gradient(135deg, var(--pink), var(--orange));
    display:inline-flex; align-items:center; justify-content:center; font-size:10px; margin-right:5px;
  }

  .sl-titles{
    position:absolute; bottom:14px; left:20px; right:20px; z-index:2;
    text-align:center;
  }
  .sl-titles .track{ font-family:'Space Grotesk'; font-size:20px; font-weight:700; color:#fff; }
  .sl-titles .artist{ font-size:14px; color:rgba(255,255,255,0.85); margin-top:2px; }

  .sl-body{ padding:18px 20px 22px; }
  .sl-choose{ text-align:center; font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }

  .sl-platform-row{
    display:flex; align-items:center; gap:12px;
    background:#1b1729; border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; margin-bottom:9px;
    text-decoration:none; color:var(--text);
    transition:border-color .15s, transform .15s;
  }
  .sl-platform-row:hover{ border-color:rgba(255,255,255,0.25); transform:translateY(-1px); }
  .sl-platform-row .ic{
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .sl-platform-row .name{ flex:1; font-size:14px; font-weight:600; }
  .sl-platform-row .action{
    font-size:12px; color:var(--text-muted); font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  .sl-footer{
    text-align:center; margin-top:16px; font-size:10.5px; color:#5f5a72; line-height:1.6;
  }
  .sl-footer a{ color:#8f8aa8; text-decoration:underline; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  function slEsc(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function detectDevice(){
    const ua = navigator.userAgent;
    if(/mobile/i.test(ua)) return 'Mobile';
    if(/tablet|ipad/i.test(ua)) return 'Tablet';
    return 'Desktop';
  }
  function detectBrowser(){
    const ua = navigator.userAgent;
    if(/edg/i.test(ua)) return 'Edge';
    if(/chrome/i.test(ua)) return 'Chrome';
    if(/safari/i.test(ua)) return 'Safari';
    if(/firefox/i.test(ua)) return 'Firefox';
    return 'Outro';
  }
  function detectOS(){
    const ua = navigator.userAgent;
    if(/android/i.test(ua)) return 'Android';
    if(/iphone|ipad|ipod/i.test(ua)) return 'iOS';
    if(/windows/i.test(ua)) return 'Windows';
    if(/mac/i.test(ua)) return 'macOS';
    if(/linux/i.test(ua)) return 'Linux';
    return 'Outro';
  }

  async function trackEvent(smartLinkId, eventType){
    try{
      await supabaseClient.from('smart_link_events').insert({
        smart_link_id: smartLinkId,
        event_type: eventType,
        device: detectDevice(),
        browser: detectBrowser(),
        os: detectOS(),
        referrer: document.referrer || null,
      });
    }catch(e){
      console.warn('Não foi possível registrar o evento:', e);
    }
  }

  function renderNotFound(){
    document.querySelector('.sl-page').innerHTML = `
      <div style="padding:50px 24px; text-align:center;">
        <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; margin-bottom:10px;">
          <span style="width:18px; height:18px; border-radius:5px; background:linear-gradient(135deg,var(--pink),var(--orange)); display:inline-flex; align-items:center; justify-content:center; font-size:10px; margin-right:5px;">V</span>iraHits
        </div>
        <p style="color:var(--text-muted); font-size:14px;">Esse Smart Link não existe ou foi removido.</p>
      </div>`;
  }

  function renderSmartLink(l){
    document.title = l.track_name + ' — ' + l.artist_name + ' | ViraHits';
    document.getElementById('slPageTrack').textContent = l.track_name;
    document.getElementById('slPageArtist').textContent = l.artist_name;
    if(l.cover_url){
      document.querySelector('.sl-cover-wrap').innerHTML =
        '<img src="' + slEsc(l.cover_url) + '" alt="">' +
        document.querySelector('.sl-cover-wrap').innerHTML;
    }

    const platforms = platformDefs
      .filter(p => l[p.urlField])
      .map(p => Object.assign({ url: l[p.urlField] }, p));

    const listEl = document.getElementById('slPlatformList');
    listEl.innerHTML = platforms.map(p => `
      <a class="sl-platform-row" href="${slEsc(p.url)}" target="_blank" rel="noopener" data-platform="${slEsc(p.key)}">
        <span class="ic" style="background:${p.color}22;">${p.svg}</span>
        <span class="name">${slEsc(p.label)}</span>
        <span class="action">${slEsc(p.action)} →</span>
      </a>
    `).join('') || '<p style="text-align:center; color:var(--text-muted); font-size:13px;">Nenhuma plataforma disponível ainda.</p>';

    listEl.querySelectorAll('.sl-platform-row').forEach(a => {
      a.addEventListener('click', () => trackEvent(l.id, a.dataset.platform));
    });

    trackEvent(l.id, 'view');
  }

  (async function init(){
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if(!slug){
      renderNotFound();
      return;
    }

    const { data, error } = await supabaseClient
      .from('smart_links')
      .select('*')
      .eq('slug', slug)
      .single();

    if(error || !data){
      renderNotFound();
      return;
    }

    renderSmartLink(data);
  })();
</script>
